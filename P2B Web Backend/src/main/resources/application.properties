# Server Port Configuration
server.port=${PORT:8080}

# LLM API Credentials (Groq)
groq.api.key=${GROQ_API_KEY:your_groq_api_key_here}
gemini.api.url=https://api.groq.com/openai/v1/chat/completions
gemini.api.key=${groq.api.key}

# Relational Database: PostgreSQL (Railway / Neon / Local)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/p2b_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Document Database: MongoDB (Atlas / Local)
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/p2b_db}

# Google Auth Configuration
google.client.id=${GOOGLE_CLIENT_ID:your_google_client_id_here}
google.client.secret=${GOOGLE_CLIENT_SECRET:your_google_client_secret_here}

# CORS Allowed Origins
cors.allowed.origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,https://*.vercel.app}

# Logging Level
logging.level.root=INFO
logging.level.com.email.writer=DEBUG
